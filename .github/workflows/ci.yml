name: CI — Portfolio Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: no permissions unless explicitly granted
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Static file & structure validation
  # ─────────────────────────────────────────────
  validate:
    name: Validate Static Files
    runs-on: ubuntu-latest

    steps:
      # Pinned to actions/checkout v4
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Verify all JSX files referenced in index.html actually exist
      - name: Check referenced JSX files exist
        run: |
          echo "Checking JSX file references in index.html..."
          missing=0
          for file in bootstrap.jsx data.jsx leadership-data.jsx chrome.jsx hero-projects.jsx \
                      achievements-contact.jsx leadership.jsx career.jsx \
                      detail-modal.jsx app.jsx package.json; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              missing=1
            else
              echo "✅ Found: $file"
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "One or more required files are missing."
            exit 1
          fi

      # Verify vercel.json is valid JSON
      - name: Validate vercel.json
        run: |
          python3 -c "import json, sys; json.load(open('vercel.json'))" && \
          echo "✅ vercel.json is valid JSON"

      - name: Build production site
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ─────────────────────────────────────────────
  # Job 2: Broken link checker
  # ─────────────────────────────────────────────
  link-check:
    name: Check for Broken Links
    runs-on: ubuntu-latest
    # Only run on PRs to avoid spamming on every push
    if: github.event_name == 'pull_request'

    steps:
      # Pinned to actions/checkout v4
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to lycheeverse/lychee-action v2.8.0
      - name: Check links in HTML and JSX files
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          # Scan HTML files; skip localhost and CDN unpkg (they can be flaky in CI)
          args: >-
            --verbose
            --no-progress
            --exclude "localhost"
            --exclude "127.0.0.1"
            --exclude "unpkg.com"
            --exclude "fonts.googleapis.com"
            --exclude "fonts.gstatic.com"
            *.html
          fail: true

  # ─────────────────────────────────────────────
  # Job 3: Security header audit (vercel.json)
  # ─────────────────────────────────────────────
  security-audit:
    name: Audit Security Headers
    runs-on: ubuntu-latest

    steps:
      # Pinned to actions/checkout v4
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required security headers are present
        run: |
          echo "Auditing security headers in vercel.json..."
          required_headers=(
            "Content-Security-Policy"
            "X-Content-Type-Options"
            "X-Frame-Options"
            "Referrer-Policy"
            "Permissions-Policy"
          )
          content=$(cat vercel.json)
          missing=0
          for header in "${required_headers[@]}"; do
            if echo "$content" | grep -q "$header"; then
              echo "✅ $header"
            else
              echo "❌ Missing header: $header"
              missing=1
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "One or more security headers are missing from vercel.json."
            exit 1
          fi
          echo "All security headers present."
